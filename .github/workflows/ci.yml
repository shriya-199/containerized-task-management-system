name: Daily Task Manager CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FRONTEND_PORT: "8081"
  BACKEND_PORT: "3000"

jobs:
  build-and-verify:
    name: Build and Verify Frontend
    runs-on: ubuntu-latest

    steps:
      # Checkout project files from the repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Show Docker versions for clear CI logs.
      - name: Show Docker version
        run: |
          docker --version
          docker compose version

      # Validate docker-compose.yml before building.
      - name: Validate Docker Compose file
        run: docker compose config

      # Build frontend and backend Docker images.
      - name: Build Docker images
        run: docker compose build

      # Start frontend and backend containers.
      - name: Start containers
        run: docker compose up -d

      # Verify backend health endpoint.
      - name: Verify backend health
        run: |
          curl --fail --silent --show-error "http://localhost:${BACKEND_PORT}/health" | grep "healthy"

      # Verify that the app is served successfully.
      - name: Verify Daily Task Manager page
        run: |
          curl --fail --silent --show-error "http://localhost:${FRONTEND_PORT}" | grep "Daily Task Manager"

      # Show running containers in CI logs.
      - name: Verify container status
        run: docker compose ps

      # Print success message.
      - name: Success log
        run: echo "Daily Task Manager built and verified successfully."

      # Print logs if any step fails.
      - name: Failure diagnostics
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs || true

      # Clean up containers after workflow.
      - name: Tear down containers
        if: always()
        run: docker compose down --remove-orphans
