name: Daily Task Manager CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FRONTEND_PORT: "8081"
  BACKEND_PORT: "3000"

jobs:
  build-and-verify:
    name: Build and Verify App
    runs-on: ubuntu-latest

    steps:
      # Checkout project files from the repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Show Docker versions for clear CI logs.
      - name: Show Docker version
        run: |
          docker --version
          docker compose version

      # Validate docker-compose.yml before building.
      - name: Validate Docker Compose file
        run: docker compose config

      # Build frontend and backend Docker images.
      - name: Build Docker images
        run: docker compose build

      # Start frontend and backend containers.
      - name: Start containers
        run: |
          docker compose up -d
          docker compose ps

      # Verify backend health endpoint with retries because the container may need a few seconds to become ready.
      - name: Verify backend health
        shell: bash
        run: |
          for attempt in {1..30}; do
            echo "Checking backend health, attempt ${attempt}/30"

            if curl --fail --silent --show-error "http://localhost:${BACKEND_PORT}/health" | grep "healthy"; then
              echo "Backend is healthy"
              exit 0
            fi

            docker compose ps
            sleep 2
          done

          echo "Backend did not become healthy in time"
          docker compose logs backend
          exit 1

      # Verify that the frontend app is served successfully.
      - name: Verify TaskFlow AI page
        shell: bash
        run: |
          for attempt in {1..30}; do
            echo "Checking frontend page, attempt ${attempt}/30"

            if curl --fail --silent --show-error "http://localhost:${FRONTEND_PORT}" | grep "TaskFlow AI"; then
              echo "Frontend is serving TaskFlow AI"
              exit 0
            fi

            docker compose ps
            sleep 2
          done

          echo "Frontend did not become ready in time"
          docker compose logs frontend
          exit 1

      # Show running containers in CI logs.
      - name: Verify container status
        run: docker compose ps

      # Print success message.
      - name: Success log
        run: echo "TaskFlow AI built and verified successfully."

      # Print logs if any step fails.
      - name: Failure diagnostics
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs || true

      # Clean up containers after workflow.
      - name: Tear down containers
        if: always()
        run: docker compose down --remove-orphans
