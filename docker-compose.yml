services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daily-task-manager-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - task-data:/usr/src/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: daily-task-manager-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend

volumes:
  task-data:
    driver: local
